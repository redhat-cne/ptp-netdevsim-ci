# Reusable netdevsim CI. Call from any ptp-operator (or monorepo) PR:
#
#   jobs:
#     netdevsim-ci:
#       uses: redhat-cne/ptp-netdevsim-ci/.github/workflows/netdevsim.yml@main
#
# This workflow checks out this CI repo (scripts + ptp-tools) and the caller
# operator tree (sources + test/). DKMS modules come from redhat-cne/netdevsim-dkms.
#
# Ubuntu 26.04 / ethtool 6.19 is supported by create-vrt-clocks.sh and the
# apt helpers, but GHA stays on 24.04 until netdevsim-dkms kernel 7.0 shims
# are on main (DKMS_BRANCH).

name: "Reusable: ptp-operator netdevsim CI"

on:
  workflow_call:
    inputs:
      operator-repository:
        description: Operator repository (owner/name). Defaults to the caller repository.
        type: string
        default: '${{ github.repository }}'
      operator-ref:
        description: Operator git ref or SHA. Defaults to the caller SHA.
        type: string
        default: '${{ github.sha }}'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  DKMS_PKG: netdevsim
  DKMS_VER: "6.9.5"
  DKMS_REPO: https://github.com/redhat-cne/netdevsim-dkms.git
  DKMS_BRANCH: main
  # Optional: set to "true" to stream run-on-vm child command logs.
  # RUN_ON_VM_VERBOSE: "true"

jobs:
  # ------------------------------------------------------------------
  # DKMS build + smoke tests (every PR and workflow_dispatch)
  # ------------------------------------------------------------------
  dkms-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Runner info
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - name: Checkout netdevsim CI
        uses: actions/checkout@v5
        with:
          repository: redhat-cne/ptp-netdevsim-ci
          # Callers pin this reusable workflow at @main. github.workflow_sha is
          # the *caller* commit (PR merge SHA), which does not exist in this
          # repo and makes checkout fail with "not our ref".
          ref: main
          path: ptp-netdevsim-ci

      - name: Clone netdevsim-dkms
        run: git clone --depth 1 --branch "${DKMS_BRANCH}" "${DKMS_REPO}" /tmp/netdevsim-dkms

      - name: Install DKMS dependencies
        timeout-minutes: 12
        run: |
          sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-apt.sh" update
          sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-apt.sh" install \
            dkms gcc make ethtool linuxptp \
            linux-headers-$(uname -r)

      - name: Install extra kernel modules
        timeout-minutes: 12
        run: |
          # gnss.ko is in extra-modules on Azure kernels; netdevsim needs it.
          sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-install-extra-modules.sh"

      - name: Install DKMS source tree
        run: |
          sudo mkdir -p /usr/src/${DKMS_PKG}-${DKMS_VER}
          sudo cp -a /tmp/netdevsim-dkms/Makefile /tmp/netdevsim-dkms/dkms.conf \
            /tmp/netdevsim-dkms/install-udev-rule.sh /tmp/netdevsim-dkms/99-nsim-ptp.rules \
            /tmp/netdevsim-dkms/include /tmp/netdevsim-dkms/ptp \
            /tmp/netdevsim-dkms/dpll /tmp/netdevsim-dkms/netdevsim \
            /usr/src/${DKMS_PKG}-${DKMS_VER}/

      - name: DKMS add + build + install
        id: build
        run: |
          sudo dkms add ${DKMS_PKG}/${DKMS_VER}
          if sudo dkms build ${DKMS_PKG}/${DKMS_VER} 2>&1; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "::warning::DKMS build failed — dumping make.log"
            sudo cat /var/lib/dkms/${DKMS_PKG}/${DKMS_VER}/build/make.log || true
            exit 1
          fi
          sudo dkms install --force ${DKMS_PKG}/${DKMS_VER}
          sudo cp /tmp/netdevsim-dkms/99-nsim-ptp.rules /etc/udev/rules.d/
          sudo udevadm control --reload-rules

      - name: Load modules
        id: load
        run: |
          set -e
          sudo modprobe gnss && echo "gnss loaded" || echo "gnss skipped"
          sudo modprobe nsim_ptp
          echo "nsim_ptp loaded"
          sudo modprobe nsim_ptp_mock
          echo "nsim_ptp_mock loaded"
          sudo modprobe nsim_dpll
          echo "nsim_dpll loaded"
          if ! sudo modprobe netdevsim pci_bus_nr=0x1f; then
            echo "::error::netdevsim failed to load (needs gnss from linux-modules-extra)"
            sudo dmesg | tail -n 40 || true
            exit 1
          fi
          echo "netdevsim loaded"
          lsmod | grep -E 'nsim_ptp|nsim_dpll|netdevsim|gnss' || true
          sudo chmod 666 /dev/nsim_ptp* 2>/dev/null || true
          echo "load_ok=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test — create netdevsim device
        if: steps.load.outputs.load_ok == 'true'
        run: |
          set -euo pipefail
          BUS_NR=$(cat /sys/module/netdevsim/parameters/pci_bus_nr 2>/dev/null || echo 31)
          BUS=$(printf "%02x" "$BUS_NR")
          FAKE_ROOT=$(ls /sys/bus/pci/devices/ 2>/dev/null | grep ":${BUS}:00\.0" | head -1)
          DOMAIN="${FAKE_ROOT:+$(echo "$FAKE_ROOT" | cut -d: -f1)}"
          : "${DOMAIN:=0000}"
          PCI_ADDR="${DOMAIN}:${BUS}:02.0"
          echo "Using PCI address: ${PCI_ADDR}"
          echo "1 ${PCI_ADDR} 1" | sudo tee /sys/bus/netdevsim/new_device
          sleep 1
          ls /sys/bus/netdevsim/devices/netdevsim1/

      - name: Smoke test — verify PTP clock
        if: steps.load.outputs.load_ok == 'true'
        run: |
          set -euo pipefail
          ls /sys/class/nsim_ptp/
          ls -la /dev/nsim_ptp* /dev/ptp* 2>/dev/null || echo "No PTP devices found"
          readlink /dev/ptp0 2>/dev/null | grep -q nsim_ptp \
            && echo "OK: /dev/ptp0 -> $(readlink /dev/ptp0)" \
            || echo "WARN: /dev/ptp0 symlink not found"

      - name: Smoke test — verify ethtool PHC
        if: steps.load.outputs.load_ok == 'true'
        run: |
          BUS_NR=$(cat /sys/module/netdevsim/parameters/pci_bus_nr 2>/dev/null || echo 31)
          BUS=$(printf "%02x" "$BUS_NR")
          FAKE_ROOT=$(ls /sys/bus/pci/devices/ 2>/dev/null | grep ":${BUS}:00\.0" | head -1)
          DOMAIN="${FAKE_ROOT:+$(echo "$FAKE_ROOT" | cut -d: -f1)}"
          : "${DOMAIN:=0000}"
          IFACE=$(ls /sys/bus/pci/devices/${DOMAIN}:${BUS}:02.0/net/ 2>/dev/null | head -1)
          if [ -z "$IFACE" ]; then
            echo "WARN: No interface found"
            exit 0
          fi
          ethtool -T "$IFACE"
          PHC=$(ethtool -T "$IFACE" | awk '
            /PTP Hardware Clock:/ { print $4; exit }
            /Hardware timestamp provider index:/ { print $5; exit }
          ')
          if [ -z "$PHC" ] || [ "$PHC" = "none" ]; then
            echo "::error::ethtool -T $IFACE did not report a PHC index"
            exit 1
          fi
          echo "OK: PHC index $PHC"

      - name: Cleanup
        if: always()
        run: |
          echo "1" | sudo tee /sys/bus/netdevsim/del_device 2>/dev/null || true
          sudo rmmod netdevsim nsim_dpll nsim_ptp_mock nsim_ptp 2>/dev/null || true
          sudo dkms remove ${DKMS_PKG}/${DKMS_VER} --all 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "## DKMS Smoke Tests (ubuntu-24.04)" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: ubuntu-24.04" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ steps.build.outputs.status || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Load: ${{ steps.load.outputs.load_ok || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # ptp-operator: build images once and upload as artifact
  # ------------------------------------------------------------------
  ptp-images:
    needs: dkms-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Runner info
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - name: Checkout netdevsim CI
        uses: actions/checkout@v5
        with:
          repository: redhat-cne/ptp-netdevsim-ci
          # Callers pin this reusable workflow at @main. github.workflow_sha is
          # the *caller* commit (PR merge SHA), which does not exist in this
          # repo and makes checkout fail with "not our ref".
          ref: main
          path: ptp-netdevsim-ci

      - name: Checkout operator
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.operator-repository }}
          ref: ${{ inputs.operator-ref }}
          path: operator

      - name: Install podman 5.x
        timeout-minutes: 10
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_$(lsb_release -rs)/Release.key" \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg > /dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg] \
            https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_$(lsb_release -rs)/ /" \
            | sudo tee /etc/apt/sources.list.d/devel:kubic:libcontainers:unstable.list > /dev/null
          sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-apt.sh" update
          sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-apt.sh" install podman
          podman --version
          # The kubic repo may not carry a crun newer than the distro's
          # 1.14.1 which rejects OCI runtime spec v1.2.1 from podman 5.x.
          # Install crun >= 1.14.3 from upstream GitHub releases.
          CRUN_VER=1.19.1
          sudo curl -fsSL -o /usr/bin/crun \
            "https://github.com/containers/crun/releases/download/${CRUN_VER}/crun-${CRUN_VER}-linux-amd64"
          sudo chmod +x /usr/bin/crun
          crun --version | head -1
          # Serialize podman CLI via one API server (avoids Kind exec SQLite deadlock).
          sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/start-podman-api-service.sh"

      - name: Copy checkouts to /root
        run: |
          sudo cp -a "$GITHUB_WORKSPACE/ptp-netdevsim-ci" /root/ptp-netdevsim-ci
          sudo cp -a "$GITHUB_WORKSPACE/operator" /root/ptp-operator

      - name: "Build images and export tarball"
        run: |
          sudo bash -l <<'BUILD'
          set -euo pipefail
          set -x
          export CI=true GITHUB_ACTIONS=true
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman
          export OPERATOR_ROOT=/root/ptp-operator
          export CI_ROOT=/root/ptp-netdevsim-ci

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-netdevsim-ci/scripts
          ./run-on-vm.sh --dkms --images "${VM_IP}"

          rm -rf /tmp/go-build* /root/.cache/go-build
          BUILD

      - name: Upload image tarball
        uses: actions/upload-artifact@v7
        with:
          name: ptp-images
          path: /tmp/ptp-images.tar
          retention-days: 1

  # ------------------------------------------------------------------
  # ptp-operator: one parallel runner per scenario
  # ------------------------------------------------------------------
  ptp-test:
    needs: ptp-images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [oc, bc, dualnicbc, dualnicbcha, dualfollower]
    steps:
      - name: "Runner info (${{ matrix.mode }})"
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - name: Checkout netdevsim CI
        uses: actions/checkout@v5
        with:
          repository: redhat-cne/ptp-netdevsim-ci
          # Callers pin this reusable workflow at @main. github.workflow_sha is
          # the *caller* commit (PR merge SHA), which does not exist in this
          # repo and makes checkout fail with "not our ref".
          ref: main
          path: ptp-netdevsim-ci

      - name: Checkout operator
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.operator-repository }}
          ref: ${{ inputs.operator-ref }}
          path: operator

      - name: Check clock mode support
        id: mode
        run: |
          set -euo pipefail
          export OPERATOR_ROOT="${GITHUB_WORKSPACE}/operator"
          # shellcheck source=scripts/lib/operator-compat.sh
          source "${GITHUB_WORKSPACE}/ptp-netdevsim-ci/scripts/lib/operator-compat.sh"
          echo "operator-version=$(ptp_operator_version)" >> "$GITHUB_OUTPUT"
          if ptp_mode_supported "${{ matrix.mode }}"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Mode ${{ matrix.mode }} is supported by operator $(ptp_operator_version)"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Mode ${{ matrix.mode }} is not implemented in operator $(ptp_operator_version); skipping Kind tests."
          fi

      - name: Install podman 5.x
        if: steps.mode.outputs.skip != 'true'
        timeout-minutes: 10
        run: |
          . /etc/os-release
          # 26.04 has podman 5.x in the distro; kubic is 22.04/24.04 only.
          if [[ "${VERSION_ID}" == "26.04" ]]; then
            sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-apt.sh" update
            sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-apt.sh" install podman
          else
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${VERSION_ID}/Release.key" \
              | gpg --dearmor | sudo tee /etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg > /dev/null
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg] \
              https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${VERSION_ID}/ /" \
              | sudo tee /etc/apt/sources.list.d/devel:kubic:libcontainers:unstable.list > /dev/null
            sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-apt.sh" update
            sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-apt.sh" install podman
            # The kubic repo may not carry a crun newer than the distro's
            # 1.14.1 which rejects OCI runtime spec v1.2.1 from podman 5.x.
            CRUN_VER=1.19.1
            sudo curl -fsSL -o /usr/bin/crun \
              "https://github.com/containers/crun/releases/download/${CRUN_VER}/crun-${CRUN_VER}-linux-amd64"
            sudo chmod +x /usr/bin/crun
            crun --version | head -1
          fi
          podman --version
          # Serialize podman CLI via one API server (avoids Kind exec SQLite deadlock).
          sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/start-podman-api-service.sh"

      - name: Install OpenShift CLI (oc)
        if: steps.mode.outputs.skip != 'true'
        run: |
          if ! command -v oc &>/dev/null; then
            curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
            sudo tar xzf openshift-client-linux.tar.gz -C /usr/local/bin oc kubectl
            rm -f openshift-client-linux.tar.gz
          fi
          oc version --client

      - name: Install DKMS dependencies
        if: steps.mode.outputs.skip != 'true'
        timeout-minutes: 12
        run: |
          sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-apt.sh" install \
            dkms gcc make ethtool linuxptp \
            linux-headers-$(uname -r)

      - name: Install extra kernel modules
        if: steps.mode.outputs.skip != 'true'
        timeout-minutes: 12
        run: |
          sudo bash "$GITHUB_WORKSPACE/ptp-netdevsim-ci/scripts/ci-install-extra-modules.sh"

      - name: Clone and install DKMS modules
        if: steps.mode.outputs.skip != 'true'
        run: |
          git clone --depth 1 --branch "${DKMS_BRANCH}" "${DKMS_REPO}" /tmp/netdevsim-dkms
          sudo mkdir -p /usr/src/${DKMS_PKG}-${DKMS_VER}
          sudo cp -a /tmp/netdevsim-dkms/Makefile /tmp/netdevsim-dkms/dkms.conf \
            /tmp/netdevsim-dkms/install-udev-rule.sh /tmp/netdevsim-dkms/99-nsim-ptp.rules \
            /tmp/netdevsim-dkms/include /tmp/netdevsim-dkms/ptp \
            /tmp/netdevsim-dkms/dpll /tmp/netdevsim-dkms/netdevsim \
            /usr/src/${DKMS_PKG}-${DKMS_VER}/
          sudo dkms add ${DKMS_PKG}/${DKMS_VER}
          sudo dkms build ${DKMS_PKG}/${DKMS_VER}
          sudo dkms install --force ${DKMS_PKG}/${DKMS_VER}
          sudo cp /tmp/netdevsim-dkms/99-nsim-ptp.rules /etc/udev/rules.d/
          sudo udevadm control --reload-rules

      - name: Copy checkouts to /root
        if: steps.mode.outputs.skip != 'true'
        run: |
          sudo cp -a "$GITHUB_WORKSPACE/ptp-netdevsim-ci" /root/ptp-netdevsim-ci
          sudo cp -a "$GITHUB_WORKSPACE/operator" /root/ptp-operator

      - name: Download image tarball
        if: steps.mode.outputs.skip != 'true'
        uses: actions/download-artifact@v7
        with:
          name: ptp-images
          path: /tmp

      - name: "Load images into local registry"
        if: steps.mode.outputs.skip != 'true'
        run: |
          sudo bash -l <<'LOAD'
          set -euo pipefail
          set -x
          export CI=true GITHUB_ACTIONS=true
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman

          VM_IP=$(hostname -I | awk '{print $1}')
          export OPERATOR_ROOT=/root/ptp-operator
          export CI_ROOT=/root/ptp-netdevsim-ci
          cd /root/ptp-netdevsim-ci/scripts
          ./run-on-vm.sh --dkms --load /tmp/ptp-images.tar "${VM_IP}"
          LOAD

      - name: "Free disk space before tests"
        if: steps.mode.outputs.skip != 'true'
        run: |
          sudo bash -l <<'CLEANUP'
          set -euo pipefail
          rm -rf /tmp/ptp-images.tar /tmp/ptp-images-load
          rm -rf /tmp/go-build* /var/cache/apt /root/.cache
          sync
          echo 3 > /proc/sys/vm/drop_caches || true
          df -h
          free -h
          CLEANUP

      - name: "Run scenario: ${{ matrix.mode }}"
        if: steps.mode.outputs.skip != 'true'
        run: |
          sudo bash -l <<'DEPLOY'
          set -euo pipefail
          set -x
          export CI=true GITHUB_ACTIONS=true
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman

          VM_IP=$(hostname -I | awk '{print $1}')
          export OPERATOR_ROOT=/root/ptp-operator
          export CI_ROOT=/root/ptp-netdevsim-ci
          cd /root/ptp-netdevsim-ci/scripts
          ./run-on-vm.sh --dkms --deploy "${VM_IP}" --mode "${{ matrix.mode }}" "${VM_IP}"
          DEPLOY

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ptp-artifacts-${{ matrix.mode }}
          path: /tmp/artifacts/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          for id in $(ls /sys/bus/netdevsim/devices/ 2>/dev/null | sed 's/netdevsim//'); do
            echo "$id" | sudo tee /sys/bus/netdevsim/del_device 2>/dev/null || true
          done
          sudo rmmod netdevsim nsim_dpll nsim_ptp_mock nsim_ptp 2>/dev/null || true
          sudo dkms remove ${DKMS_PKG}/${DKMS_VER} --all 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "## ptp-operator: ${{ matrix.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: ubuntu-24.04" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Operator: ${{ steps.mode.outputs.operator-version }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.mode.outputs.skip }}" == "true" ]]; then
            echo "- Result: skipped (clock mode not implemented in this operator)" >> "$GITHUB_STEP_SUMMARY"
          fi
